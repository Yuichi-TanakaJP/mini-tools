name: CI

on:
  push:
    branches: [main]
    # Only this reviewed documentation path is ignored; new paths run CI.
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [main]
    # Only this reviewed documentation path is ignored; new paths run CI.
    paths-ignore:
      - 'README.md'

# Keep only the latest PR validation; preserve independent main pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
